plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// release signing key: android/key.properties (written by the GitHub workflows from repository secrets, never
// committed). Without it the APK is signed with the throwaway debug key, and Android will not install it over a
// copy signed with the release key
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "org.dragonpilot.opview"
    // match dashy: explicit SDK versions for old headunit compat
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        // Geomglot's OPRivView: its own app id, so it installs alongside the original opview
        // (org.dragonpilot.opview) and Gerrylum's OPRivView (com.electricvalentines.oprivview), each with its own key
        applicationId = "com.geomglot.oprivview"
        minSdk = 24          // Android 7.0, the lowest Flutter 3.47+ supports; pinned, do NOT use flutter.minSdkVersion (floats)
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // include 32-bit ARM for old headunits
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider, to hand a downloaded update to Android's installer
    implementation "androidx.core:core:1.13.1"
}
