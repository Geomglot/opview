name: Replay for Apple silicon Macs

# Builds OPRivView Replay for Apple silicon Macs as a disk image, on GitHub's Apple silicon runner, with no need for an
# M-series Mac of our own: ffmpeg from source, the server (PyInstaller) and the app (Flutter), put together by
# `make dmg` in replay/. It then starts the server and ffmpeg from the built app, so a release that cannot run on
# Apple silicon fails here. The disk image is kept as a workflow artifact; download it from the run's page.
# replay-release.yml calls this twice, for ARM on macos-latest and for Intel on macos-15-intel, with the release's version.
on:
  push:
    branches: [rivian-support]
    paths: ['replay/**', 'macos/**', 'lib/**', 'pubspec.*', '.github/workflows/replay-mac.yml']
  pull_request:
    branches: [rivian-support]
    paths: ['replay/**', 'macos/**', 'lib/**', 'pubspec.*', '.github/workflows/replay-mac.yml']
  # by hand from the Actions page, for either kind of Mac (Intel runs on macos-15-intel)
  workflow_dispatch:
    inputs:
      arch:
        description: the kind of Mac to build for
        type: choice
        options: [ARM, Intel]
        default: ARM
  workflow_call:
    inputs:
      arch:
        description: ARM or Intel, the kind of Mac the disk image is for
        type: string
        default: ARM
      runner:
        type: string
        default: macos-latest
      version:
        description: the full version, e.g. 0.1.2-test.1; empty for a -dev build
        type: string
        default: ''
      build_number:
        type: string
        default: '1'

jobs:
  dmg:
    runs-on: ${{ inputs.runner || (inputs.arch == 'Intel' && 'macos-15-intel' || 'macos-latest') }}
    env:
      MAC_ARCH: ${{ inputs.arch || 'ARM' }}
      SIDE_ARCH: ${{ (inputs.arch || 'ARM') == 'Intel' && 'x86_64' || 'arm64' }}
    steps:
      - uses: actions/checkout@v6

      # make dmg builds for the Mac it runs on, so the runner must be the kind of Mac the disk image is named for
      - name: This runner is the kind of Mac the disk image is for
        run: test "$(uname -m)" = "$SIDE_ARCH"

      # GitHub's Intel image (macos-15-intel) defaults to Xcode 16, whose SDK lacks what the Flutter plugins now use
      # (connectivity_plus wants the macOS 26 SDK); the Apple silicon image already defaults to Xcode 26
      - name: Xcode 26 on the Intel runner
        if: env.MAC_ARCH == 'Intel'
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$xcode" ]; then echo "::error::this runner has no Xcode 26"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # ffmpeg takes several minutes to build and only changes with its build script, so it is kept between runs
      - name: ffmpeg from the cache
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: replay/build/ffmpeg-${{ env.SIDE_ARCH }}
          key: ffmpeg-mac-${{ env.SIDE_ARCH }}-${{ hashFiles('replay/packaging/build_ffmpeg.sh') }}

      # the checkout makes the build script newer than the cached ffmpeg, which make would take as a reason to rebuild
      - name: Cached ffmpeg is up to date
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        run: touch "replay/build/ffmpeg-$SIDE_ARCH/ffmpeg"

      - name: nasm for the ffmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: replay/requirements.txt

      - name: Python environment for the server
        working-directory: replay
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Server tests
        working-directory: replay
        run: .venv/bin/python -m pytest -q

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # make picks the arch of this runner, which is MAC_ARCH (checked above); the Makefile checks every bundled program is that arch
      - name: Build the disk image
        working-directory: replay
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            make dmg VERSION="${{ inputs.version }}" BUILD_NUMBER=${{ inputs.build_number }}
          else
            make dmg BUILD_NUMBER=${{ github.run_number }}
          fi

      - name: The bundled server starts
        working-directory: replay
        run: |
          app="dist/OPRivView Replay.app/Contents"
          "$app/Resources/oprivview-replay-server/oprivview-replay-server" --port 8799 --no-connect \
            --app "$app/MacOS/OPRivView Replay" &
          for i in $(seq 60); do
            if curl -sf http://127.0.0.1:8799/health; then echo; kill $!; exit 0; fi
            sleep 1
          done
          echo "the server did not answer /health within a minute"; kill $! || true; exit 1

      # a dummy token must reach comma Connect and be refused there: anything else means the bundled trust store is wrong
      - name: The bundled server reaches comma Connect over TLS
        working-directory: replay
        run: |
          app="dist/OPRivView Replay.app/Contents"
          mkdir -p "$HOME/.comma"
          echo not-a-real-token > "$HOME/.comma/jwt"
          "$app/Resources/oprivview-replay-server/oprivview-replay-server" --port 8799 --host 127.0.0.1 \
            --app "$app/MacOS/OPRivView Replay" &
          pid=$!
          for i in $(seq 60); do
            if curl -sf http://127.0.0.1:8799/health >/dev/null; then break; fi
            sleep 1
          done
          routes=$(curl -sf http://127.0.0.1:8799/routes) || { echo "the server did not answer /routes"; kill $pid || true; exit 1; }
          kill $pid || true
          rm -f "$HOME/.comma/jwt"
          echo "$routes"
          case "$routes" in
            *"cannot reach comma Connect"*) echo "the bundled server does not trust comma Connect's certificate"; exit 1 ;;
            *"comma Connect answered 401"*) echo "Connect was reached over TLS and refused the dummy token, as expected" ;;
            *) echo "unexpected /routes answer"; exit 1 ;;
          esac

      # the same check the server makes before a render: a few blank frames through Apple's hardware encoder
      - name: The bundled ffmpeg encodes with VideoToolbox
        working-directory: replay
        run: |
          ffmpeg="dist/OPRivView Replay.app/Contents/Resources/ffmpeg/ffmpeg"
          encode() {
            head -c $((256 * 144 * 3 / 2 * 20)) /dev/zero |
              "$ffmpeg" -v error -f rawvideo -pix_fmt yuv420p -s 256x144 -r 20 -i - -c:v h264_videotoolbox "$@" -y -f mp4 out.mp4
          }
          # GitHub's Intel Macs are virtual machines with no graphics hardware, and VideoToolbox refuses its software
          # encoder unless asked; a real Intel Mac has the hardware. There, encoding in software still proves the encoder
          # is built in and the bundled ffmpeg runs.
          if ! encode; then
            if [ "$MAC_ARCH" != Intel ]; then exit 1; fi
            echo "::warning::no hardware H.264 encoder on this Intel runner; checked VideoToolbox's software encoder instead"
            encode -allow_sw 1
          fi
          "dist/OPRivView Replay.app/Contents/Resources/ffmpeg/ffprobe" -v error -show_entries stream=codec_name -of csv=p=0 out.mp4 | grep -x h264

      - uses: actions/upload-artifact@v7
        with:
          name: OPRivView-Replay-macOS-${{ env.MAC_ARCH }}
          path: replay/dist/OPRivView-Replay-*-macOS-${{ env.MAC_ARCH }}.dmg
          if-no-files-found: error
